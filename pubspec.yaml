name: tsk_4
description: "A new Flutter project."
publish_to: 'none'





version: 1.0.0+1

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  location: ^8.0.1

  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.1.1
  dio: ^5.6.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.7
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  url_launcher: ^6.1.12
  go_router: ^17.0.0
  geocoding: ^4.0.0
  
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^5.0.0
  intl_utils: ^2.8.14


flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 100
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Roboto-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/Roboto-BlackItalic.ttf
          weight: 900
          style: italic
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/Roboto_Condensed-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto_Condensed-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Roboto_Condensed-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto_Condensed-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto_Condensed-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto_Condensed-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto_Condensed-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto_Condensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto_Condensed-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto_Condensed-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Roboto_Condensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto_Condensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Black.ttf
          weight: 900
        - asset: assets/fonts/Roboto_Condensed-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/roboto-italic.ttf
          style: italic
flutter_intl:
  enabled: true
  main_locale: en
  arb_dir: lib/src/common/l10n
  output_dir: lib/src/common/l10n/generated
